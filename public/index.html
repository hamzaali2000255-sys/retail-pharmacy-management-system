<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PharmaPOS</title><link rel="stylesheet" href="/styles.css"></head><body><div class="app"><aside><div class="brand">💊 <span>PharmaPOS</span></div><nav><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="pos">Point of Sale</button><button class="nav" data-page="medicines">Medicines</button><button class="nav" data-page="sales">Sales History</button></nav><div class="side-note">Retail pharmacy<br>management system</div></aside><main><header><div><p class="eyebrow">PHARMACY MANAGEMENT</p><h1 id="title">Dashboard</h1></div><div class="status"><span></span> System online</div></header><section id="dashboard" class="page"><div class="cards"><div class="card"><small>Medicines</small><strong id="medCount">0</strong></div><div class="card"><small>Stock tablets</small><strong id="tabletCount">0</strong></div><div class="card"><small>Today's sales</small><strong id="salesCount">0</strong></div><div class="card"><small>Today's revenue</small><strong id="revenue">Rs 0</strong></div></div><div class="panel"><div class="panel-head"><h2>Expiry watch</h2><button class="primary" onclick="showPage('pos')">New Sale</button></div><div id="expiry" class="table-wrap"></div></div></section><section id="pos" class="page hidden"><div class="pos-grid"><div class="panel"><div class="panel-head"><h2>New Sale</h2><input id="search" class="search" placeholder="Search medicine or barcode..." oninput="searchMedicines()"></div><div id="products" class="products"></div></div><div class="panel cart"><div class="panel-head"><h2>Cart</h2><button class="ghost" onclick="cart=[];renderCart()">Clear</button></div><div id="cart"></div><div class="checkout"><label>Discount <input id="discount" type="number" min="0" value="0" oninput="renderCart()"></label><label>Payment <select id="payment"><option value="cash">Cash</option><option value="card">Card</option><option value="bank">Bank</option><option value="credit">Credit</option></select></label><div class="total"><span>Total</span><strong id="total">Rs 0</strong></div><button class="primary wide" onclick="checkout()">Complete Sale</button></div></div></div></section><section id="medicines" class="page hidden"><div class="panel"><div class="panel-head"><h2>Medicine Inventory</h2><button class="primary" onclick="openMedicineForm()">+ Add Medicine</button></div><div id="medicineTable" class="table-wrap"></div></div></section><section id="sales" class="page hidden"><div class="panel"><div class="panel-head"><h2>Recent Sales</h2></div><div id="salesTable" class="table-wrap"></div></div></section></main></div><div id="modal" class="modal hidden"><div class="modal-box"><div class="panel-head"><h2>Add Medicine</h2><button class="ghost" onclick="closeModal()">×</button></div><form id="medicineForm"><div class="form-grid"><input name="name" placeholder="Medicine name *" required><input name="generic_name" placeholder="Generic name"><input name="barcode" placeholder="Barcode"><input name="category" placeholder="Category"><input name="manufacturer" placeholder="Manufacturer"><input name="batch_no" placeholder="Batch number"><label>Expiry <input name="expiry_date" type="date"></label><input name="purchase_price" type="number" step="0.01" placeholder="Purchase price"><input name="box_price" type="number" step="0.01" placeholder="Box price *" required><input name="strip_price" type="number" step="0.01" placeholder="Strip price *" required><input name="tablet_price" type="number" step="0.01" placeholder="Tablet price *" required><input name="tablets_per_strip" type="number" min="1" value="10" placeholder="Tablets/strip"><input name="strips_per_box" type="number" min="1" value="10" placeholder="Strips/box"><input name="stock_tablets" type="number" min="0" value="0" placeholder="Opening stock (tablets)"><input name="reorder_level" type="number" min="0" value="10" placeholder="Reorder level"></div><button class="primary wide" type="submit">Save Medicine</button></form></div></div><script src="/app.js"></script></body></html>
